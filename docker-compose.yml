services:
  # Reverse Proxy (Public Entry Point)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - server
    networks:
      - app-network
    restart: always

  # React Frontend Container (Internal)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react_frontend
    expose:
      - "80"
    networks:
      - app-network
    restart: always

  # Express Backend Container (Internal)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: express_backend
    expose:
      - "5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - APP_NAME=SolveSpace Technologies API
      - APP_VERSION=2.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge


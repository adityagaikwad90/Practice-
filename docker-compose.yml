services:
  # Reverse Proxy (Public Entry Point)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: reverse_proxy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot

    depends_on:
      - client
      - server

    networks:
      - app-network

    restart: always

  # React Frontend Container (Internal)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: react_frontend
    expose:
      - "80"
    networks:
      - app-network
    restart: always

  # Express Backend Container (Internal)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: express_backend
    expose:
      - "5001"

    environment:
      - PORT=5001
      - NODE_ENV=production

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

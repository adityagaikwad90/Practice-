# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name solvespace.online www.solvespace.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name solvespace.online www.solvespace.online;

    ssl_certificate /etc/letsencrypt/live/solvespace.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solvespace.online/privkey.pem;

    location / {
        proxy_pass http://client:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://server:5001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

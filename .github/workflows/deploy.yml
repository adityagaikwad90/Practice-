name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "========== STARTING SOLVESPACE TECH DEPLOYMENT =========="

            # Directory fallback
            if [ -d "/home/ec2-user/Practice-" ]; then
              cd /home/ec2-user/Practice-
            elif [ -d "/home/ubuntu/Practice-" ]; then
              cd /home/ubuntu/Practice-
            else
              cd ~/Practice- || cd .
            fi

            echo "Deployment Directory:"
            pwd

            echo "Fetching latest changes from Git..."
            git fetch --all
            git reset --hard origin/main

            echo "Building and restarting Docker containers..."
            if command -v docker-compose &> /dev/null; then
              docker-compose down
              docker-compose up --build -d
            else
              docker compose down
              docker compose up --build -d
            fi

            echo "Pruning unused Docker assets..."
            docker image prune -f

            echo "Verifying running Docker containers:"
            docker ps

            echo "========== DEPLOYMENT SUCCESSFUL =========="